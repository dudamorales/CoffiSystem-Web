<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoffiSystem - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>

    <main class="container">

        <section class="lateral">
            <img src="imagens/coffisystem-logo.png" alt="Logo CoffiSystem">

            <h1>BEM-VINDO<br>AO<br>COFFI<br>SYSTEM ;)</h1>
        </section>

        <section class="login">
            <form id="formLogin">

                <label for="usuario">CPF</label>
                <input type="text" id="usuario" placeholder="Digite seu CPF" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" required>

                <div class="botoes">
                    <button type="submit">Login</button>
                    <button type="button" id="cadastrar">Cadastrar</button>
                </div>

                <p id="mensagem"></p>

            </form>
        </section>

    </main>

</body>
</html>
