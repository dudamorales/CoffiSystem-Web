<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoffiSystem - Histórico de Vendas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="container-historico">

        <header class="cabecalho">
            <div class="espaco-logo">
                <img src="imagens/coffisystem-logo.png" alt="Logo CoffiSystem">
            </div>
            <h1>COFFISYSTEM</h1>
        </header>

        <section class="historico">
            <h2>Histórico de Vendas</h2>

            <div class="busca-vendas">
                <label for="buscarVenda">Buscar:</label>
                <input type="text" id="buscarVenda">
            </div>

            <div class="tabela-vendas">
                <table>
                    <thead>
                        <tr>
                            <th>Id</th>
                            <th>Produto</th>
                            <th>Categoria</th>
                            <th>Valor</th>
                            <th>Quantidade</th>
                            <th>Cliente</th>
                        </tr>
                    </thead>
                        <tbody id="listaVendas">
                            <tr><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                            <tr><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                            <tr><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                            <tr><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                            <tr><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                            <tr><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                            <tr><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                            <tr><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                            <tr><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                        </tbody>
                </table>
            </div>

            <button type="button" class="botao-voltar"
                    onclick="window.location.href='menu-contabilidade.html'">
                Voltar
            </button>
        </section>

    </main>

    <script src="js/script.js"></script>
</body>
</html>
