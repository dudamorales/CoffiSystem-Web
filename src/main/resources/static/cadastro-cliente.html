<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoffiSystem - Cadastro de Clientes</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container-cliente">
        <header class="cabecalho">
            <div class="espaco-logo">
                <img src="imagens/coffisystem-logo.png" alt="Logo CoffiSystem">
            </div>
            <h1>COFFISYSTEM</h1>
        </header>

        <section class="cadastro-cliente">
            <h2>Cadastro de Clientes</h2>

            <form id="formCliente">
                <div class="campo">
                    <label for="nomeCliente">Nome completo:</label>
                    <input type="text" id="nomeCliente" required>
                </div>

                <div class="campo">
                    <label for="emailCliente">E-mail:</label>
                    <input type="email" id="emailCliente" required>
                </div>

                <div class="campo">
                    <label for="telefoneCliente">Telefone:</label>
                    <input type="tel" id="telefoneCliente" required>
                </div>

                <div class="botoes-cadastro">
                    <button type="button"
                            onclick="window.location.href='menu-vendedor.html'">
                        Voltar
                    </button>

                    <button type="submit">Cadastrar</button>
                </div>
            </form>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
