<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoffiSystem - Cadastro de Vendas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container-vendas">
        <header class="cabecalho">
            <div class="espaco-logo">
                <img src="imagens/coffisystem-logo.png" alt="Logo CoffiSystem">
            </div>
            <h1>COFFISYSTEM</h1>
        </header>

    <section class="cadastro-vendas">
        <h2>Cadastro de Vendas</h2>

        <form id="formVenda">

            <div class="campo">
                <label for="produtoVenda">Nome do produto:</label>
                <select id="produtoVenda" required>
                    <option value="">Selecione um produto</option>
                </select>
            </div>

            
            <div class="campo">
                <label for="clienteVenda">Cliente:</label>
                <select id="clienteVenda" required>
                    <option value="">Selecione um cliente</option>
                </select>
            </div>

            <div class="campo">
                <label for="codigoVenda">Código:</label>
                <input type="text" id="codigoVenda" readonly>
            </div>

            <div class="campo">
                <label for="valorVenda">Valor:</label>
                <input type="text" id="valorVenda" readonly>
            </div>

            <div class="campo">
                <label for="quantidadeVenda">Quantidade:</label>
                <input type="number" id="quantidadeVenda"
                       min="1" step="1" required>
            </div>

            <div class="campo">
                <label for="promocaoVenda">Promoção:</label>
                <select id="promocaoVenda">
                    <option value="">Sem promoção</option>
                </select>
            </div>

            <div class="botoes-cadastro">
                <button type="button"
                        onclick="window.location.href='menu-vendedor.html'">
                    Voltar
                </button>

                <button type="submit">Cadastrar</button>
            </div>

        </form>
    </section>
</main>

<script src="js/script.js"></script>

</body>
</html>
