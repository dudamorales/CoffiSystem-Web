<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoffiSystem - Cadastro de Produtos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="container-cadastro-produto">

        <header class="cabecalho">
            <div class="espaco-logo">
                <img src="imagens/coffisystem-logo.png" alt="Logo CoffiSystem">
            </div>
            <h1>COFFISYSTEM</h1>
        </header>

        <section class="cadastro-produto">
            <h2>Cadastro de Produtos</h2>

            <form id="formProduto">

                <div class="campo">
                    <label for="nomeProduto">Nome do produto:</label>
                    <input type="text" id="nomeProduto" required>
                </div>

                <div class="campo">
                    <label for="valor">Valor:</label>
                    <input type="number" id="valor" min="0" step="0.01" required>
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade:</label>
                    <input type="number" id="quantidade" min="0" required>
                </div>

                <div class="campo">
                    <label for="validade">Data de validade:</label>
                    <input type="date" id="validade" required>
                </div>

                <div class="campo">
                    <label for="categoria">Categoria:</label>
                    <select id="categoria" required>
                        <option value="">Selecione</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="fornecedor">Fornecedor:</label>
                    <select id="fornecedor" required>
                        <option value="">Selecione um fornecedor</option>
                    </select>
                </div>

                <div class="botoes-cadastro">
                    <button type="button"
                            onclick="window.location.href='menu-gerente.html'">
                        Voltar
                    </button>
                    <button type="submit">Cadastrar</button>
                </div>

            </form>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
