<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoffiSystem - Cadastro de Funcionários</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="container-cadastro">

        <header class="cabecalho">
            <div class="espaco-logo">
                <img src="imagens/coffisystem-logo.png" alt="Logo CoffiSystem">
            </div>
            <h1>COFFISYSTEM</h1>
        </header>

        <section class="cadastro">
            <h2>Cadastro de Funcionários</h2>

            <form id="formCadastro">

                <div class="campo">
                    <label for="nome">Nome completo:</label>
                    <input type="text" id="nome" required>
                </div>

                <div class="campo">
                    <label for="nascimento">Data de nascimento:</label>
                    <input type="date" id="nascimento" required>
                </div>

                <div class="campo">
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" maxlength="14"
                           placeholder="000.000.000-00" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" required>
                </div>

                <div class="campo">
                    <label for="endereco">Endereço:</label>
                    <input type="text" id="endereco" required>
                </div>

                <div class="campo">
                    <label for="funcao">Função:</label>
                    <select id="funcao" required>
                        <option value="">Selecione</option>
                        <option value="gerente">Gerente</option>
                        <option value="vendedor">Vendedor</option>
                        <option value="contabilidade">Contabilidade</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="senha">Senha de acesso:</label>
                    <input type="password" id="senha" maxlength="20" required>
                </div>

                <div class="botoes-cadastro">
                    <button type="submit" id="botaoCadastrar">Cadastrar</button>

                    <button type="button" onclick="voltarLogin()">
                        Voltar Login
                    </button>
                </div>

            </form>
        </section>

    </main>

    <script>
        function voltarLogin() {
            window.location.href = "index.html";
        }

        document.getElementById("formCadastro").addEventListener("submit", async function(event) {
            event.preventDefault();

            const formulario = this;

            const funcionario = {
                nome: document.getElementById("nome").value.trim(),
                dataNascimento: document.getElementById("nascimento").value
                    .split("-").reverse().join("/"),
                cpf: document.getElementById("cpf").value.replace(/\D/g, ""),
                email: document.getElementById("email").value.trim(),
                endereco: document.getElementById("endereco").value.trim(),
                funcao: document.getElementById("funcao").value,
                senha: document.getElementById("senha").value
            };

            if (funcionario.cpf.length !== 11) {
                alert("Informe um CPF com 11 números!");
                return;
            }

            try {
                const resposta = await fetch("/api/funcionarios", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(funcionario)
                });

                if (resposta.status === 409) {
                    alert("Já existe um usuário cadastrado com esse CPF!");
                    return;
                }

                if (!resposta.ok) {
                    const detalhe = await resposta.text();
                    console.error("Erro da API:", detalhe);
                    alert("Erro ao cadastrar funcionário.");
                    return;
                }

                alert("Funcionário cadastrado com sucesso!");
                formulario.reset();

            } catch (erro) {
                console.error("Erro ao cadastrar funcionário:", erro);
                alert("Não foi possível conectar ao servidor.");
            }
        });
    </script>

</body>
</html>
