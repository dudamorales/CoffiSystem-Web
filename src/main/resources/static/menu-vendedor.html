<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoffiSystem - Menu Vendedor</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container-cadastro">

        <header class="cabecalho">
            <div class="espaco-logo">
                <img src="imagens/coffisystem-logo.png" alt="Logo CoffiSystem">
            </div>
            <h1>COFFISYSTEM</h1>
        </header>

        <section class="menu-vendedor">
            <h2>Escolha o que cadastrar:</h2>

            <div class="opcoes-vendedor">
                <button type="button" id="cadastrarVenda"
                    onclick="window.location.href='cadastro-venda.html'">
                Venda
            </button>

                <button type="button" id="cadastrarCliente"
                    onclick="window.location.href='cadastro-cliente.html'">
                Cliente
            </button>
            </div>

            <button type="button" class="botao-voltar" onclick="voltarLogin()">
                Voltar
            </button>
        </section>

    </main>

    <script>
        function voltarLogin() {
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
